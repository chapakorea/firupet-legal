<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Firupet legal documents: privacy policy and terms and conditions, in English and Spanish.">
<title>Firupet — Legal</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: #16202c;
    background: #f7f9fc;
    -webkit-text-size-adjust: 100%;
    overflow-wrap: break-word;
  }
  .bar {
    background: #1E5FAF;
    color: #fff;
    padding: 14px 20px;
  }
  .bar .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
  .bar .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
  .bar nav { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; margin-left: auto; min-width: 0; }
  /* On a phone the links get their own full-width line and wrap among
     themselves — left inline they overflow the bar, which puts the whole
     page into horizontal scroll and clips the body text. */
  @media (max-width: 560px) {
    .bar nav { margin-left: 0; width: 100%; }
  }
  .bar nav a { color: #dce9fb; text-decoration: none; }
  .bar nav a:hover, .bar nav a:focus { color: #fff; text-decoration: underline; }
  .bar nav a[aria-current="page"] { color: #fff; font-weight: 600; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }
  h1.doctitle { font-size: 26px; line-height: 1.25; margin: 8px 0 4px; letter-spacing: -0.4px; }
  p.updated { font-size: 14px; color: #5b6876; margin: 0 0 26px; }
  h2 { font-size: 20px; line-height: 1.3; margin: 32px 0 10px; letter-spacing: -0.2px; }
  h3 { font-size: 17px; margin: 24px 0 8px; }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 16px; padding-left: 22px; }
  li { margin: 0 0 10px; }
  a { color: #1E5FAF; }
  .byline { font-size: 13px; color: #7b8794; }
  .pdf-note {
    margin-top: 40px;
    padding: 14px 16px;
    background: #eaf1fb;
    border-left: 3px solid #1E5FAF;
    border-radius: 4px;
    font-size: 14px;
  }
  .pdf-note a { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1621; color: #e3e9f2; }
    .bar { background: #16324f; }
    p.updated { color: #94a3b4; }
    a { color: #7fb0ee; }
    .byline { color: #8494a6; }
    .pdf-note { background: #16232f; border-left-color: #4a8fe8; }
  }
</style>
</head>
<body>
  <div class="bar"><div class="wrap"><span class="brand">Firupet</span></div></div>
  <main>
    <h1 class="doctitle">Legal</h1>
    <p class="updated">Documentos legales de Firupet / Firupet legal documents</p>
    <h2>English</h2>
    <ul>
      <li><a href="privacy-en.html">Privacy Policy</a></li>
      <li><a href="terms-en.html">Terms &amp; Conditions</a></li>
    </ul>
    <h2>Español</h2>
    <ul>
      <li><a href="privacy-es.html">Política de Privacidad</a></li>
      <li><a href="terms-es.html">Términos y Condiciones</a></li>
    </ul>
  </main>
</body>
</html>
